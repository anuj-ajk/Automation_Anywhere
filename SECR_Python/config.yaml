# Copy to config.yaml and adjust. Do NOT put passwords or keys in this file:
# secrets are read from environment variables (see README.md).

run:
  max_parallel_batches: 10          # batches processed at the same time
  max_parallel_files_per_batch: 5   # files of ONE batch processed at the same time
  max_db_connections: 20            # max connections THIS process opens (room left for other systems);
                                    # must be >= max_parallel_batches + 1. Past it, workers wait for a free one.
  work_dir: "%TEMP%\\SECR_work"     # local per-batch temp folders (deleted after each batch); keep it short and local
  log_dir: ./logs
  keep_work_files: false            # true = keep downloaded/split/CSV files for debugging
  created_by: ""                    # passed to LoadHHData / CalculateInvoiceData; default = OS user
  serialize_staging_loads: true     # one load per staging table at a time (MySQL GET_LOCK)
  staging_lock_timeout_seconds: 900
  insert_chunk_size: 1000
  insert_connections: 4             # big files are bulk-inserted over up to 4 connections (only free ones)
  parallel_insert_min_rows: 20000   # rows per extra connection; smaller files use one connection
  batch_status_in_progress: IN_PROGRESS   # RefBatchStatus code set when a batch is picked up ("" = leave it)
  batch_status_on_file_errors: PARTIAL_FAILURE   # final batch status when some files failed (else COMPLETE)
  # Pending mode (AA pending = true / CLI --pending): batches are claimed atomically and free slots are refilled
  claimable_statuses: [PROCESSING, PARTIAL_FAILURE]   # must match pending_batches_query below
  claim_procedure: ClaimPendingBatches   # pending mode: claim up to N batches in one call ("" = one by one, see below)
  claim_batch_procedure: ClaimBatch      # explicit batch ids (and pending ones when claim_procedure is "") are claimed through it
  pending_poll_seconds: 60          # while batches run, look for new pending ones at least this often
  pending_max_runtime_minutes: 0    # stop taking NEW batches after this many minutes (0 = until nothing is pending)
  # Stale claims: uses FileUploadBatch.ClaimedAt / ClaimedBy / ClaimPreviousStatusId (installed)
  claim_heartbeat_seconds: 60       # a running batch refreshes FileUploadBatch.ClaimedAt this often
  stale_claim_minutes: 30           # IN_PROGRESS without a refresh for this long = left behind -> released (0 = never)
  release_stale_procedure: ReleaseStaleClaims   # releases stale claims in the DB ("" = same release from Python)
  # Optional, used by "run --pending". Must return a BatchId column. Example only - adjust to
  # however new batches are flagged in your DB:
  pending_batches_query: "SELECT FB.BatchId FROM FileUploadBatch FB JOIN RefBatchStatus B ON B.BatchStatusId = FB.BatchStatusId WHERE B.Code = 'PROCESSING' OR B.Code = 'PARTIAL_FAILURE' ORDER BY FB.BatchId"


esg_db:
  host: esg-instance.cm18ojbg8cjx.eu-west-2.rds.amazonaws.com
  port: 3306
  database: esgdb
  connect_timeout: 30
  connect_retry_seconds: 5      # when the DB itself refuses a login (too many connections), wait and try
                                # again this often (and as soon as one of ours closes) until it accepts
  lock_wait_timeout_seconds: 0  # a write blocked by another session's row lock fails after this long
                                # (0 = server default innodb_lock_wait_timeout, normally 50s)

s3:
  region: eu-west-2
  download_attempts: 3          # retries network errors / throttling / 5xx (not missing key or access denied)
  retry_backoff_seconds: 5      # wait 5s, 10s, ... between attempts
  # bucket comes from SECR_S3_BUCKET

odin:
  base_uri: https://api.getodin.ai
  project_id: "356316e20dcb48658ce127"            # ProcessConfig Agent_Project_ID
  agent_id: "63622"              # ProcessConfig Agent_ID
  submit_timeout_seconds: 600
  request_timeout_seconds: 120
  poll_interval_seconds: 40 # same as the bot
  max_poll_attempts: 15     # same as the bot (~10 minutes per file)
  max_parallel_sheets: 6    # sheets of ONE file submitted / polled / downloaded at the same time
  max_parallel_requests: 20 # Odin calls + CSV downloads in flight across ALL files and batches
  submit_attempts: 3        # create chat + upload; a failed submit is retried in a new chat (HTTP 4xx except 408/429 is not retried)
  submit_retry_backoff_seconds: 10   # wait 10s, 20s, ... between attempts

sources:
  environment: DEV          # DEV / UAT / PROD -> <ENV>_<TYPE>_EM_QUERY.txt
  query_dir: "./queries"
  query_timeout_seconds: 600

notify:
  enabled: false
  smtp_host: ""
  smtp_port: 25
  use_tls: false
  from_address: ""
  to_addresses: []
  cc_addresses: []
